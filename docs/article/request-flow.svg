<text x="542.0" y="401.0" font-family="Segoe UI, sans-serif" font-size="10" fill="#7a5200" text-anchor="start" font-weight="normal" >VT OFF: OS-поток заблокирован</text>
<rect x="40.0" y="724.0" width="1320.0" height="82.0" fill="#f7f9fc" fill-opacity="1" stroke="#cfd8e3" stroke-width="1.0" rx="6.0"/>
<text x="56.0" y="746.0" font-family="Segoe UI, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Виртуальные потоки:</text>
<text x="56.0" y="764.0" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" text-anchor="start" font-weight="normal" >в точке future.get() виртуальный поток паркуется и размонтируется с carrier; carrier продолжает обслуживать другие запросы.</text>
<text x="56.0" y="782.0" font-family="Segoe UI, sans-serif" font-size="12" fill="#111" text-anchor="start" font-weight="bold" >Без виртуальных потоков:</text>
<text x="56.0" y="800.0" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" text-anchor="start" font-weight="normal" >платформенный поток Tomcat остаётся заблокированным до вызова complete(future) из ChatResponseListener.</text>

<text x="134.0" y="318.0" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" text-anchor="start" font-weight="normal" >2 warmup + 3 measurement; каждая итерация — 1000 × POST /chat</text>
<text x="134.0" y="331.0" font-family="Segoe UI, sans-serif" font-size="11" fill="#333" text-anchor="start" font-weight="normal" >concurrency = 100, response delay = 1 ms</text>

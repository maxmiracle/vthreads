<text x="52.0" y="863.0" font-family="Segoe UI, sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="normal" >Инфраструктура: PostgreSQL 17 и Kafka 3.9 в docker compose; JMH и приложение — разные JVM (external mode); одинаковые 1000 запросов и concurrency=100 в обоих режимах.</text>
